services:
  db:
    image: postgres:16-alpine
    container_name: payment_system_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_system"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: payment_system_app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/payment_system
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
